<ion-header>
  <ion-toolbar color="light">
    <ion-title>Porki Fit</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="home-background">

  <div class="home-container">
    <h2 class="home-title">Bienvenido</h2>

    <ion-card class="home-card" *ngFor="let item of [
      { texto: 'Registrar Emoción', ruta: '/emociones' },
      { texto: 'Ver Historial', ruta: '/historial' },
      { texto: 'Meditación', ruta: '/meditacion' },
      { texto: 'Foro Anónimo', ruta: '/foro' },
      { texto: 'Contactar Psicólogo', ruta: '/psicologo' },
      { texto: 'Ajustes', ruta: '/ajustes' },
      { texto: 'Cerrar Sesión', ruta: '/login', danger: true }
    ]">
      <ion-card-content>
        <ion-button
          expand="block"
          [color]="item.danger ? 'danger' : 'primary'"
          [routerLink]="item.ruta">
          {{ item.texto }}
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>

</ion-content>
